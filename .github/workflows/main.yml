name: CI/CD - Liberty X Nexus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "LibertyXNexusCRMWebApp/LibertyXNexusCRMWebApp.slnx"
  API_PROJECT: "LibertyXNexusCRMWebApp/API/API.csproj"
  FRONTEND_PROJECT: "LibertyXNexusCRMWebApp/frontend/frontend.csproj"

jobs:

  # ============================================================
  # BUILD AND TEST
  # ============================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --verbosity normal


  # ============================================================
  # PUBLISH API
  # ============================================================
  publish-api:
    name: Publish API
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Publish API
        run: |
          dotnet publish ${{ env.API_PROJECT }} \
            --configuration Release \
            --no-restore \
            --output ./publish-api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish-api


  # ============================================================
  # PUBLISH FRONTEND
  # ============================================================
  publish-frontend:
    name: Publish Frontend
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.FRONTEND_PROJECT }}

      - name: Publish Frontend
        run: |
          dotnet publish ${{ env.FRONTEND_PROJECT }} \
            --configuration Release \
            --no-restore \
            --output ./publish-frontend

      - name: Upload Frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-publish
          path: ./publish-frontend


  # ============================================================
  # DEPLOY API
  # ============================================================
  deploy-api:
    name: Deploy API to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: publish-api

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39B9EAA644F3440486A656177BE30D86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_491E6242DCB648F2900590E2E3EDF472 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FAF0BDFFBCD54A3A8233C7C6CD56DE0A }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: nexus-devteam
          slot-name: Production
          package: ./publish-api


  # ============================================================
  # DEPLOY FRONTEND
  # ============================================================
  deploy-frontend:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: publish-frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-publish
          path: ./publish-frontend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39B9EAA644F3440486A656177BE30D86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_491E6242DCB648F2900590E2E3EDF472 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FAF0BDFFBCD54A3A8233C7C6CD56DE0A }}

      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: libertyxnexus-web-thabo
          slot-name: Production
          package: ./publish-frontend
